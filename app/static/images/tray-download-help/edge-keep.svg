<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Edge: open the download menu and choose Keep</title>
  <desc id="desc">Illustration of Edge's Downloads panel. An uncommon-download warning appears below MyPortal-Tray-…-Setup.exe. The three-dot menu is outlined in blue and its Keep option is highlighted, above Delete.</desc>
  <rect width="600" height="360" rx="16" fill="#f3f6fa"/>
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#182536">
    <text x="44" y="59" font-size="25" font-weight="600">Downloads</text>
    <text x="446" y="57" font-size="20" fill="#64748b">Illustration</text>
    <path d="M40 78H560" stroke="#dbe3ed" stroke-width="2"/>
    <path d="M45 103H67L79 115V145H45Z" fill="#eef3f8" stroke="#7c8da2" stroke-width="2"/>
    <path d="M67 103V115H79" fill="none" stroke="#7c8da2" stroke-width="2"/>
    <text x="94" y="124" font-size="21" font-weight="600">MyPortal-Tray-…-Setup.exe</text>
    <text x="44" y="176" font-size="21">This file isn’t commonly downloaded.</text>
    <text x="44" y="206" font-size="21">Make sure you trust it before opening it.</text>
    <text x="44" y="257" font-size="21" fill="#52637a">Delete</text>
    <text x="44" y="305" font-size="21" fill="#0a5ca8">Open this menu</text>
  </g>
  <rect x="518" y="98" width="44" height="44" rx="6" fill="#edf5ff" stroke="#0a5ca8" stroke-width="3"/>
  <g fill="#0a5ca8"><circle cx="530" cy="120" r="2.6"/><circle cx="540" cy="120" r="2.6"/><circle cx="550" cy="120" r="2.6"/></g>
  <rect x="340" y="218" width="222" height="108" rx="8" fill="#fff" stroke="#bcc9d9" stroke-width="2"/>
  <rect x="346" y="224" width="210" height="46" rx="5" fill="#edf5ff" stroke="#0a5ca8" stroke-width="3"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="22"><text x="366" y="254" font-weight="600" fill="#0a5ca8">Keep</text><text x="366" y="305" fill="#34445a">Delete</text></g>
</svg>
