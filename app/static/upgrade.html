<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Upgrade In Progress | MyPortal</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <style>
    :root{color-scheme:dark;--bg:#0f172a;--card:#172033;--text:#f8fafc;--muted:#cbd5e1;--accent:#38bdf8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
    main{width:min(34rem,100%);padding:clamp(1.5rem,5vw,3rem);border:1px solid #334155;border-radius:1rem;background:var(--card);box-shadow:0 1.5rem 4rem #02061766;text-align:center}
    img{width:4rem;height:4rem}h1{font-size:clamp(1.65rem,5vw,2.25rem);margin:.8rem 0}p{color:var(--muted);line-height:1.6}.progress{height:.45rem;margin:1.75rem 0;border-radius:1rem;background:#334155;overflow:hidden}.progress span{display:block;width:35%;height:100%;background:var(--accent);border-radius:inherit;animation:move 1.7s ease-in-out infinite}.meta{font-size:.875rem}button{margin-top:.75rem;padding:.7rem 1rem;border:0;border-radius:.5rem;background:var(--accent);color:#082f49;font-weight:700;cursor:pointer}@keyframes move{50%{transform:translateX(185%)}}@media(prefers-reduced-motion:reduce){.progress span{animation:none;width:70%}}
  </style>
</head>
<body><main aria-labelledby="title" aria-live="polite">
  <img src="/static/favicon.svg" alt="" width="64" height="64">
  <h1 id="title">Upgrade In Progress</h1>
  <p id="detail">We’re applying a planned upgrade. Your portal will return automatically as soon as the new release is ready.</p>
  <div class="progress" role="progressbar" aria-label="Upgrade in progress"><span></span></div>
  <p class="meta" id="phase">Checking upgrade status…</p>
  <button type="button" id="retry">Check again</button>
</main><script>
(()=>{const original=sessionStorage.getItem('myportal-upgrade-return')||location.pathname+location.search+location.hash;sessionStorage.setItem('myportal-upgrade-return',original);let attempt=0,timer;
const detail=document.getElementById('detail'),phase=document.getElementById('phase');
async function poll(){clearTimeout(timer);try{const r=await fetch('/upgrade-status',{cache:'no-store',headers:{Accept:'application/json'}});if(r.ok){const s=await r.json();detail.textContent=s.message||detail.textContent;phase.textContent=s.phase==='idle'?'Waiting for the service…':`Current stage: ${String(s.phase).replaceAll('_',' ')}`;if(!s.maintenance&&(s.phase==='succeeded'||s.phase==='idle'||s.outcome==='rolled_back'||s.outcome==='interrupted')){sessionStorage.removeItem('myportal-upgrade-return');location.replace(original);return;}}}catch(_){phase.textContent='The service is restarting. We’ll keep trying.'}attempt++;timer=setTimeout(poll,Math.min(30000,2000*Math.pow(1.6,attempt)));}
document.getElementById('retry').addEventListener('click',()=>{attempt=0;poll()});poll();})();
</script></body></html>
