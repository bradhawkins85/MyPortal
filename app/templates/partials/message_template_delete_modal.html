{# Delete confirmation shared by the message template list and editor. #}
<div class="modal" id="mt-delete-modal" role="dialog" aria-modal="true" aria-labelledby="mt-delete-title" aria-describedby="mt-delete-body" aria-hidden="true" hidden>
  <div class="modal__panel mt-confirm">
    <header class="modal__header">
      <h2 class="modal__title" id="mt-delete-title">Delete template?</h2>
      <button type="button" class="modal__close" data-modal-close aria-label="Close"></button>
    </header>
    <div class="modal__body" id="mt-delete-body">
      <p><strong data-mt-delete-name></strong> will be removed permanently. Automations and templates that use its token will insert nothing in its place.</p>
      <p class="mt-confirm__warning" data-mt-delete-system hidden></p>
      <p class="scf-error" data-mt-delete-error role="alert" hidden></p>
    </div>
    <footer class="modal__footer">
      <button type="button" class="button button--ghost" data-modal-close>Cancel</button>
      <button type="button" class="button button--danger" data-mt-delete-confirm>Delete template</button>
    </footer>
  </div>
</div>
