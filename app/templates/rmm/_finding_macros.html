{# One finding as a card in the grouped list. The modal (filled from the
   page's JSON) is the focused review; <noscript> keeps the details and the
   review form usable without JavaScript. #}
{% macro finding_card(finding, csrf_token, view) -%}
{%- set device_count = finding.devices | length -%}
{%- set company_count = finding.companies | length -%}
<article class="finding-card finding-card--{{ finding.severity }}{% if not finding.is_active %} is-inactive{% endif %}{% if finding.status == 'dismissed' %} is-dismissed{% endif %}"
  id="finding-{{ finding.id }}" data-finding-card data-finding-id="{{ finding.id }}"
  data-severity="{{ finding.severity }}" data-category="{{ finding.category }}" data-status="{{ finding.status }}"
  data-active="{{ 'true' if finding.is_active else 'false' }}"
  data-search="{{ ([finding.title, finding.summary, finding.category_label, finding.source_label] + (finding.devices | map(attribute='name') | select | list) + (finding.companies | map(attribute='name') | select | list)) | join(' ') | lower }}"
  aria-labelledby="finding-{{ finding.id }}-title">
  <header class="finding-card__header">
    <span class="status status--{{ finding.severity_variant }}">{{ finding.severity_label }}</span>
    <h4 class="finding-card__title" id="finding-{{ finding.id }}-title">
      <button type="button" class="finding-card__open" data-finding-open="{{ finding.id }}" aria-haspopup="dialog" aria-controls="finding-modal">{{ finding.title }}</button>
    </h4>
  </header>
  <p class="finding-card__summary">{{ finding.summary }}</p>
  <ul class="finding-card__chips" aria-label="About this finding">
    <li class="finding-chip finding-chip--{{ finding.source }}">{{ icon('ai' if finding.source == 'ai' else 'rule') }}<span>{{ finding.source_label }}{% if finding.confidence is not none %} · {{ finding.confidence }}% confident{% endif %}</span></li>
    {% if device_count %}<li class="finding-chip">{{ icon('device') }}<span>{{ device_count }} device{{ '' if device_count == 1 else 's' }}</span></li>{% endif %}
    {% if company_count %}<li class="finding-chip">{{ icon('company') }}<span>{{ company_count }} compan{{ 'y' if company_count == 1 else 'ies' }}</span></li>{% endif %}
    <li class="finding-chip">{{ icon('clock') }}<span>First seen <span data-utc="{{ finding.first_seen_at }}">{{ finding.first_seen_at }}</span></span></li>
    {% if finding.occurrences > 1 %}<li class="finding-chip">Found in {{ finding.occurrences }} analyses</li>{% endif %}
    {% if finding.status != 'open' %}<li class="finding-chip finding-chip--status">{{ finding.status_label }}</li>{% endif %}
    {% if not finding.is_active %}<li class="finding-chip finding-chip--muted">No longer detected</li>{% endif %}
  </ul>
  <noscript>
    <details class="finding-card__details">
      <summary>Evidence and next steps</summary>
      {% if finding.evidence %}<ul class="finding-evidence">{% for line in finding.evidence %}<li>{{ line }}</li>{% endfor %}</ul>{% endif %}
      {% if finding.recommendation %}<p><strong>Next steps:</strong> {{ finding.recommendation }}</p>{% endif %}
      {% if finding.devices %}<p><strong>Devices:</strong> {% for device in finding.devices %}<a href="/assets/{{ device.asset_id }}">{{ device.name }}</a>{% if not loop.last %}, {% endif %}{% endfor %}</p>{% endif %}
      <form method="post" action="/rmm/findings/{{ finding.id }}/status" class="finding-card__review">
        {% if csrf_token %}<input type="hidden" name="_csrf" value="{{ csrf_token }}" />{% endif %}
        <input type="hidden" name="view" value="{{ view }}" />
        <label class="form-label" for="finding-{{ finding.id }}-note">Note <span class="finding-optional">optional</span></label>
        <input class="form-input" id="finding-{{ finding.id }}-note" name="note" maxlength="500" value="{{ finding.status_note }}" />
        <div class="finding-card__review-actions">
          {% if finding.status != 'acknowledged' %}<button class="button button--small" name="status" value="acknowledged">Acknowledge</button>{% endif %}
          {% if finding.status != 'dismissed' %}<button class="button button--small button--danger" name="status" value="dismissed">Dismiss</button>{% endif %}
          {% if finding.status != 'open' %}<button class="button button--small button--ghost" name="status" value="open">Reopen</button>{% endif %}
        </div>
      </form>
    </details>
  </noscript>
</article>
{%- endmacro %}
