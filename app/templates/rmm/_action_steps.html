{#- The ordered actions a check takes when it fails (rmm/_check_form.html) or an
    event log rule takes when an event matches (rmm/event_log_rules.html).

    Each action is a card in an ordered list with its own settings; they run
    top to bottom. static/js/rmm_action_steps.js adds actions from the
    <template>s, removes and reorders them, and keeps the list's order in
    action_order so the save bar notices. Without JavaScript the saved actions
    show, each can be removed on save, and one more can be added per save.

    ``c`` configures the list:
      prefix        ID prefix of the form's controls (rmm-check, rmm-rule)
      context       "check" or "rule", for the wording
      steps         the actions as form values (rmm_action_steps.form_steps)
      types         {type: label} that can be added, in picker order
      info          {type: one-line help}
      scripts       scripts to choose from
      step_scripts  {key: {"script", "fields", "saved"}} for script actions
      errors        the form's errors; an action's are keyed action-{key}-{field}
      schedule_modes, variables_id, add_key (a free key for the no-JS row),
      max_steps -#}
{% set step_icons = {
  "create_ticket": "M4 6h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4zM10 6v10",
  "run_script": "M4 17l6-6-6-6M12 19h8",
  "schedule_script": "M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z",
  "install_choco": "M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8",
} %}

{% macro _icon(kind) -%}
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="{{ step_icons.get(kind, 'M12 12h.01') }}"/></svg>
{%- endmacro %}

{% macro _error(c, key) -%}
  {%- if c.errors.get(key) %}<p class="form-help form-help--error rmm-field-error" id="{{ c.prefix }}-error-{{ key }}">{{ c.errors.get(key) }}</p>{% endif -%}
{%- endmacro %}

{% macro _invalid(c, key, help_id="") -%}
  {%- set ids = [] -%}
  {%- if help_id %}{% set ids = ids + [help_id] %}{% endif -%}
  {%- if c.errors.get(key) %}{% set ids = ids + [c.prefix ~ "-error-" ~ key] %} aria-invalid="true"{% endif -%}
  {%- if ids %} aria-describedby="{{ ids | join(' ') }}"{% endif -%}
{%- endmacro %}

{#- The settings of one action. ``kinds`` lists the types whose fields show: one
    for a card, every type for the no-JS row (each field appears once). -#}
{% macro step_fields(c, key, step, kinds) -%}
{% set p = c.prefix ~ "-action-" ~ key %}
{% set n = "action:" ~ key ~ ":" %}
{% set err = "action-" ~ key ~ "-" %}
{% set single = kinds | length == 1 %}
{% if "run_script" in kinds or "schedule_script" in kinds %}
<div class="rmm-field-row">
  <div class="form-field rmm-field--grow">
    <label class="form-label" for="{{ p }}-script">Script{% if single %} <span class="rmm-required" aria-hidden="true">*</span>{% else %} <span class="rmm-optional">to run or schedule</span>{% endif %}</label>
    <select class="form-input" id="{{ p }}-script" name="{{ n }}script_id" data-rmm-step-script data-rmm-saved-script="{{ ((c.step_scripts or {}).get(key) or {}).get('saved') and step.script_id or '' }}"{% if single %} required{% endif %}{{ _invalid(c, err ~ "script", p ~ "-script-help") }}>
      <option value="">Choose a script</option>
      {% for item in c.scripts %}<option value="{{ item.id }}" {% if step.script_id == item.id %}selected{% endif %}>{{ item.name }} ({{ item.path }})</option>{% endfor %}
    </select>
    <p class="form-help" id="{{ p }}-script-help">{{ "Checks" if c.context == "check" else "Rules" }} for every company can only use scripts in the <code>Common</code> folder.</p>
    {{ _error(c, err ~ "script") }}
  </div>
  <div class="form-field">
    <label class="form-label" for="{{ p }}-timeout">Script timeout</label>
    <div class="rmm-input-unit"><input class="form-input" id="{{ p }}-timeout" name="{{ n }}timeout_seconds" type="number" inputmode="numeric" min="30" max="86400" value="{{ step.timeout_seconds }}" aria-describedby="{{ p }}-timeout-help"><span class="rmm-input-unit__suffix" aria-hidden="true">sec</span></div>
    <p class="form-help" id="{{ p }}-timeout-help">The script is stopped after this long.</p>
  </div>
</div>
{% endif %}
{% if "schedule_script" in kinds %}
<div class="rmm-field-row" data-rmm-step-schedule>
  <div class="form-field">
    <label class="form-label" for="{{ p }}-schedule_mode">{{ "Run it" if single else "A scheduled script runs" }}</label>
    <select class="form-input" id="{{ p }}-schedule_mode" name="{{ n }}schedule_mode" data-rmm-step-schedule-mode{{ _invalid(c, err ~ "schedule_mode") }}>
      {% for mode, label in c.schedule_modes.items() %}<option value="{{ mode }}" {% if step.schedule_mode == mode %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
    {{ _error(c, err ~ "schedule_mode") }}
  </div>
  <div class="form-field" data-rmm-step-schedule-show="delay"{% if single and step.schedule_mode == "time" %} hidden{% endif %}>
    <label class="form-label" for="{{ p }}-delay">Delay</label>
    <div class="rmm-input-unit"><input class="form-input" id="{{ p }}-delay" name="{{ n }}delay_minutes" type="number" inputmode="numeric" min="1" max="10080" value="{{ step.delay_minutes }}"><span class="rmm-input-unit__suffix" aria-hidden="true">min</span></div>
  </div>
  <div class="form-field" data-rmm-step-schedule-show="time"{% if single and step.schedule_mode != "time" %} hidden{% endif %}>
    <label class="form-label" for="{{ p }}-run_time">Time of day</label>
    <input class="form-input" id="{{ p }}-run_time" name="{{ n }}run_time" type="time" value="{{ step.run_time }}"{{ _invalid(c, err ~ "run_time") }}>
    {{ _error(c, err ~ "run_time") }}
  </div>
  <div class="form-field" data-rmm-step-schedule-show="time"{% if single and step.schedule_mode != "time" %} hidden{% endif %}>
    <label class="form-label" for="{{ p }}-timezone">Time zone</label>
    <input class="form-input" id="{{ p }}-timezone" name="{{ n }}schedule_timezone" maxlength="64" value="{{ step.schedule_timezone }}" placeholder="Australia/Sydney" autocomplete="off" spellcheck="false"{{ _invalid(c, err ~ "timezone") }}>
    {{ _error(c, err ~ "timezone") }}
  </div>
</div>
<p class="form-help">{% if c.context == "check" %}Scheduled once each time the check starts failing. If the check passes before then, the run is dropped.{% else %}The script runs on the device that sent the event. While a run is waiting there, more matching events do not schedule another.{% endif %}</p>
{% endif %}
{% if "install_choco" in kinds %}
<div class="form-field">
  <label class="form-label" for="{{ p }}-package_id">Chocolatey package ID{% if single %} <span class="rmm-required" aria-hidden="true">*</span>{% endif %}</label>
  <input class="form-input" id="{{ p }}-package_id" name="{{ n }}package_id" maxlength="128" value="{{ step.package_id }}" placeholder="googlechrome" autocomplete="off" spellcheck="false"{% if single %} required{% endif %}{{ _invalid(c, err ~ "package_id", p ~ "-package-help") }}>
  <p class="form-help" id="{{ p }}-package-help">Use an exact package ID from the company’s enabled sources. Runs on active Windows devices and appears in patch run history. Installs Chocolatey if needed and never automatically reboots.</p>
  {{ _error(c, err ~ "package_id") }}
</div>
{% endif %}
{% if "create_ticket" in kinds %}
{% if c.context == "check" %}
<label class="toggle" for="{{ p }}-auto-close">
  <input type="checkbox" id="{{ p }}-auto-close" name="{{ n }}auto_close_when_resolved" value="1" {% if step.auto_close_when_resolved %}checked{% endif %} aria-describedby="{{ p }}-auto-close-help">
  <span>Auto-close when resolved</span>
</label>
<p class="form-help" id="{{ p }}-auto-close-help">When the check passes again, move its ticket to Resolved if that status exists, otherwise Closed.</p>
{% elif single %}
<p class="form-help">The ticket lists the matching events. Scripts later in the list run after it is raised.</p>
{% endif %}
{% endif %}
{%- endmacro %}

{#- One action as a card in the list. -#}
{% macro step_card(c, step, position) -%}
{% set key = step.key %}
{% set p = c.prefix ~ "-action-" ~ key %}
{% set n = "action:" ~ key ~ ":" %}
{% set label = c.types.get(step.type, step.type) %}
{% set saved = (c.step_scripts or {}).get(key) or {} %}
<li class="rmm-step" data-rmm-step data-rmm-step-key="{{ key }}" data-rmm-step-type="{{ step.type }}" aria-labelledby="{{ p }}-type">
  <input type="hidden" name="action_key" value="{{ key }}">
  <input type="hidden" name="{{ n }}type" value="{{ step.type }}">
  <header class="rmm-step__header">
    <span class="rmm-step__number" data-rmm-step-number aria-hidden="true">{{ position }}</span>
    <span class="rmm-step__icon" aria-hidden="true">{{ _icon(step.type) }}</span>
    <div class="rmm-step__heading">
      <h4 class="rmm-step__title" id="{{ p }}-type" tabindex="-1"><span class="visually-hidden" data-rmm-step-position>Action {{ position }}: </span>{{ label }}</h4>
      <p class="rmm-step__text">{{ c.info.get(step.type, "") }}</p>
    </div>
    <div class="rmm-step__tools" data-rmm-step-tools hidden>
      <button type="button" class="button button--ghost button--small rmm-step__tool" data-rmm-step-move="up" aria-label="Move {{ label }} up" title="Move up"><span aria-hidden="true">↑</span></button>
      <button type="button" class="button button--ghost button--small rmm-step__tool" data-rmm-step-move="down" aria-label="Move {{ label }} down" title="Move down"><span aria-hidden="true">↓</span></button>
      <button type="button" class="button button--ghost button--small rmm-step__tool rmm-step__remove" data-rmm-step-remove aria-label="Remove {{ label }}">Remove</button>
    </div>
  </header>
  {{ _error(c, "action-" ~ key ~ "-type") }}
  <div class="rmm-step__body">
    {{ step_fields(c, key, step, [step.type]) }}
    {% if step.type in ("run_script", "schedule_script") %}
    <div class="rmm-script-values" data-rmm-step-values>
      {% if saved.saved %}
      {% if saved.fields %}
      <h5 class="rmm-subheading">{{ saved.script.name }} values</h5>
      <p class="form-help">Given to the script each time it runs. Use {% if c.context == "check" %}<code>{% raw %}{{check.result}}{% endraw %}</code>, <code>{% raw %}{{check.name}}{% endraw %}</code> and the other check variables to pass on what failed{% else %}<code>{% raw %}{{event.message}}{% endraw %}</code>, <code>{% raw %}{{event.event_id}}{% endraw %}</code> and the other event variables to pass on the event that matched{% endif %}.</p>
      <div class="form-grid">
        {% for field in saved.fields %}
        <div class="form-field">
          <label class="form-label" for="{{ p }}-entry-{{ loop.index }}">{{ field.name }}{% if field.mandatory %} <span class="rmm-required" aria-hidden="true">*</span>{% endif %}</label>
          <input class="form-input" id="{{ p }}-entry-{{ loop.index }}" name="{{ n }}entry:{{ field.key }}" list="{{ c.variables_id }}" value="{{ field.value }}" {% if field.sensitive %}type="password" autocomplete="new-password"{% endif %} placeholder="{% if field.sensitive and field.value_set %}Saved: leave blank to keep it{% elif field.default %}Default: {{ field.default }}{% endif %}"{% if field.help %} aria-describedby="{{ p }}-entry-{{ loop.index }}-help"{% endif %}>
          {% if field.help %}<p class="form-help" id="{{ p }}-entry-{{ loop.index }}-help">{{ field.help }}</p>{% endif %}
        </div>
        {% endfor %}
      </div>
      {% else %}
      <p class="rmm-note">{{ saved.script.name }} has no parameters or environment variables.</p>
      {% endif %}
      {% endif %}
    </div>
    <p class="rmm-note" data-rmm-step-pending{% if saved.saved %} hidden{% endif %}>Once you save, the script's parameters appear here to fill in.</p>
    {% endif %}
    <noscript>
      <label class="form-checkbox rmm-step__remove-on-save"><input type="checkbox" name="{{ n }}remove" value="1"> Remove this action when saving</label>
    </noscript>
  </div>
</li>
{%- endmacro %}

{% macro action_list(c) -%}
{% set steps = c.steps or [] %}
<div class="rmm-steps-editor" data-rmm-steps-editor data-rmm-steps-max="{{ c.max_steps }}" data-rmm-steps-single="create_ticket" data-rmm-steps-prefix="{{ c.prefix }}">
  <div class="rmm-steps-editor__header">
    <h4 class="rmm-subheading" id="{{ c.prefix }}-actions" tabindex="-1">Actions, in order</h4>
    <p class="form-help">They run one after another from the top{% if c.context == "check" %} each time the check starts failing{% else %} for the device that sent the event{% endif %}. Add as many scripts as you need; one ticket follows the problem on each device.</p>
  </div>
  {{ _error(c, "actions") }}
  <input type="hidden" name="action_order" value="{{ steps | map(attribute='key') | join(',') }}" data-rmm-steps-order>
  <ol class="rmm-steps" data-rmm-steps aria-labelledby="{{ c.prefix }}-actions">
    {% for step in steps %}{{ step_card(c, step, loop.index) }}{% endfor %}
  </ol>
  <p class="rmm-steps__empty" data-rmm-steps-empty{% if steps %} hidden{% endif %}>{% if c.context == "check" %}No actions yet. The result still shows on the device.{% else %}No actions yet.{% endif %} Add one to raise a ticket, run a script or schedule one for later.</p>
  <p class="visually-hidden" role="status" aria-live="polite" data-rmm-steps-status></p>

  <div class="rmm-steps-editor__add" data-rmm-step-add hidden>
    <button type="button" class="button button--secondary" data-rmm-step-add-toggle aria-expanded="false" aria-controls="{{ c.prefix }}-action-picker">+ Add an action</button>
    <div class="rmm-step-picker" id="{{ c.prefix }}-action-picker" role="group" aria-label="Choose an action to add" data-rmm-step-picker hidden>
      {% for kind, label in c.types.items() %}
      <button type="button" class="rmm-step-picker__option" data-rmm-step-add-type="{{ kind }}" aria-describedby="{{ c.prefix }}-pick-{{ kind }}-text">
        <span class="rmm-step__icon" aria-hidden="true">{{ _icon(kind) }}</span>
        <span class="rmm-step-picker__title">{{ label }}</span>
        <span class="rmm-step-picker__text" id="{{ c.prefix }}-pick-{{ kind }}-text">{{ c.info.get(kind, "") }}</span>
      </button>
      {% endfor %}
    </div>
  </div>
  {% for kind, label in c.types.items() %}{% set blank = (c.blank_steps or {}).get(kind) %}
  {% if blank %}<template data-rmm-step-template="{{ kind }}">{{ step_card(c, blank, "") }}</template>{% endif %}
  {% endfor %}

  <noscript>
    {% set new_step = (c.blank_steps or {}).get("run_script") or {} %}
    <fieldset class="rmm-step rmm-step--new">
      <legend class="form-label">Add an action <span class="rmm-optional">optional</span></legend>
      <input type="hidden" name="action_key" value="{{ c.add_key }}">
      <div class="form-field">
        <label class="form-label" for="{{ c.prefix }}-action-{{ c.add_key }}-new-type">Then</label>
        <select class="form-input" id="{{ c.prefix }}-action-{{ c.add_key }}-new-type" name="action:{{ c.add_key }}:type">
          <option value="">Nothing more</option>
          {% for kind, label in c.types.items() %}<option value="{{ kind }}">{{ label }}</option>{% endfor %}
        </select>
        <p class="form-help">It is added at the end of the list. Fill in only the settings it uses.</p>
      </div>
      {{ step_fields(c, c.add_key, new_step, c.types.keys() | list) }}
    </fieldset>
  </noscript>
</div>
{%- endmacro %}
