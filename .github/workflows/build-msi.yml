# Build the MyPortal Tray MSI installer on Windows and upload it to the
# GitHub release that triggered this workflow, or the release selected manually.
#
# Triggered by: publishing a new GitHub release (any tag), or manually via workflow_dispatch.
# Runner:       windows-latest (required — WiX v7 only works on Windows)
#
# The MSI is built with WiX v7 (installed as a .NET global tool).
# The -acceptEula wix7 flag accepts the FireGiant OSMF EULA non-interactively
# per https://docs.firegiant.com/wix/osmf/.

name: Build MSI

on:
  release:
    # Build installers when a release is published. Using only `created` misses
    # common flows where a draft release is created first and published later.
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build installers for (defaults to current ref)'
        required: false
        type: string

permissions:
  contents: write   # needed to upload the artifact to the release

jobs:
  build-msi:
    name: Build Windows MSI
    runs-on: windows-latest

    defaults:
      run:
        working-directory: tray

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tray/go.mod
          cache-dependency-path: tray/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tray/chat-shell/package-lock.json

      - name: Install WiX v7
        shell: pwsh
        run: dotnet tool install --global wix --version "7.*"

      - name: Build Windows binaries
        shell: pwsh
        run: |
          $env:GOOS      = "windows"
          $env:GOARCH    = "amd64"
          $env:CGO_ENABLED = "0"
          $version = "${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}"
          $ldflags = "-X 'github.com/bradhawkins85/myportal-tray/internal/updater.AgentVersion=$version'"

          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null

          go build -ldflags $ldflags -o dist\windows\myportal-tray-service.exe .\service
          $env:GOFLAGS = "-tags=nowebview"
          # -H windowsgui hides the console window so the tray UI runs silently
          $uiLdflags = "$ldflags -H windowsgui"
          go build -ldflags $uiLdflags -o dist\windows\myportal-tray-ui.exe     .\ui
      
      - name: Build Windows chat shell
        shell: pwsh
        working-directory: tray/chat-shell
        run: |
          npm ci
          npm run build:win
      - name: Stage Windows chat shell runtime
        shell: pwsh
        working-directory: tray
        run: |
          if (-not (Test-Path chat-shell\dist\win-unpacked)) {
            Write-Host 'Available chat-shell/dist contents:'
            Get-ChildItem -Recurse -Depth 2 chat-shell\dist | Format-Table -AutoSize
            throw 'electron-builder did not create chat-shell/dist/win-unpacked'
          }
          Remove-Item -Recurse -Force dist\windows\chat-shell -ErrorAction SilentlyContinue
          Copy-Item chat-shell\dist\win-unpacked dist\windows\chat-shell -Recurse -Force

      - name: Import code-signing certificate
        id: signing-certificate
        shell: pwsh
        timeout-minutes: 2
        env:
          SIGNING_CERTIFICATE_PFX: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PFX)) {
            throw 'The WINDOWS_SIGNING_CERTIFICATE_PFX repository secret is not configured.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            throw 'The WINDOWS_SIGNING_CERTIFICATE_PASSWORD repository secret is not configured.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'myportal-tray-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_PFX))
          } catch {
            throw 'WINDOWS_SIGNING_CERTIFICATE_PFX is not a valid base64-encoded PFX.'
          }

          $password = ConvertTo-SecureString $env:SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          try {
            # Import-PfxCertificate does not trigger key-protection dialogs when
            # targeting the current-user store, making it safe for headless runners.
            # certutil -importPFX was used previously but hangs on Windows Server 2025
            # (the image behind windows-latest since Aug 2025).
            $certificate = Import-PfxCertificate -FilePath $pfxPath `
              -CertStoreLocation 'Cert:\CurrentUser\My' `
              -Password $password `
              -Exportable
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }
          if (-not $certificate.HasPrivateKey) {
            throw 'The signing PFX did not contain a certificate with a private key.'
          }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT

          # Trust the self-signed certificate on the runner so signature
          # verification fails the build for anything other than a valid file.
          # Adding to the current-user Root store via the .NET X509Store API is
          # non-interactive and does not require elevation — safe for headless runners.
          $rootStore = [System.Security.Cryptography.X509Certificates.X509Store]::new(
            'Root', [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser)
          $rootStore.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          $rootStore.Add($certificate)
          $rootStore.Close()

      - name: Sign Windows executables
        shell: pwsh
        run: |
          $certificate = Get-Item "Cert:\CurrentUser\My\${{ steps.signing-certificate.outputs.thumbprint }}"
          $executables = @(Get-ChildItem dist\windows -Filter '*.exe' -File -Recurse)
          if ($executables.Count -eq 0) {
            throw 'No Windows executables were found to sign.'
          }

          foreach ($executable in $executables) {
            Set-AuthenticodeSignature -FilePath $executable.FullName -Certificate $certificate -HashAlgorithm SHA256 | Out-Null
            $signature = Get-AuthenticodeSignature -FilePath $executable.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature on $($executable.FullName): $($signature.StatusMessage)"
            }
          }

      - name: Build MSI
        shell: pwsh
        run: |
          $binDir = (Resolve-Path dist\windows).Path
          $version = "${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}"
          $msiVersion = ($version -replace '^v', '' -replace '[^0-9.].*$', '')
          if ([string]::IsNullOrWhiteSpace($msiVersion)) {
            $msiVersion = '0.0.0'
          }
          $versionParts = @($msiVersion.Split('.') | ForEach-Object {
            if ($_ -match '^\d+$') { [int]$_ } else { 0 }
          })
          while ($versionParts.Count -lt 3) {
            $versionParts += 0
          }
          $msiVersion = ($versionParts[0..2] -join '.')

          wix build -acceptEula wix7 installer\windows\myportal-tray.wxs `
            -arch x64 `
            -d "BinDir=$binDir" `
            -d "ProductVersion=$msiVersion" `
            -o dist\windows\myportal-tray.msi

      - name: Sign Windows installer
        shell: pwsh
        run: |
          $installer = (Resolve-Path dist\windows\myportal-tray.msi).Path
          $certificate = Get-Item "Cert:\CurrentUser\My\${{ steps.signing-certificate.outputs.thumbprint }}"
          Set-AuthenticodeSignature -FilePath $installer -Certificate $certificate -HashAlgorithm SHA256 | Out-Null
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid') {
            throw "Invalid Authenticode signature on ${installer}: $($signature.StatusMessage)"
          }

      - name: Upload MSI to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}
          files: tray/dist/windows/myportal-tray.msi

      - name: Remove signing certificate from runner
        if: always() && steps.signing-certificate.outputs.thumbprint != ''
        shell: pwsh
        run: |
          $thumbprint = '${{ steps.signing-certificate.outputs.thumbprint }}'
          Remove-Item "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
          Remove-Item "Cert:\CurrentUser\Root\$thumbprint" -Force -ErrorAction SilentlyContinue
