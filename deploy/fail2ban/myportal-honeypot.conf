# Fail2ban filter for MyPortal honeypot traps.
#
# Matches "HONEYPOT TRAP" lines MyPortal writes to FAIL2BAN_LOG_PATH when a
# client requests a well-known scanner target (/wp-login.php, /.env,
# /.git/config, /phpmyadmin ...) that the portal does not serve. The address
# is anchored directly after the tag; everything a client controls (the path)
# comes later in the line, so it cannot name a different address.
#
# Example line:
# 2026-11-24T10:00:00.000+0000 | WARNING | - | - | honeypot | HONEYPOT TRAP ip=203.0.113.10 rule=dotfile status=404 method=GET path=/.env

[Definition]
failregex = ^\s*\| WARNING \| - \| - \| honeypot \| HONEYPOT TRAP ip=<ADDR> rule=
ignoreregex =

[Init]
journalmatch =
