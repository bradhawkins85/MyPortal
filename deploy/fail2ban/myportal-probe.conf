# Fail2ban filter for MyPortal unknown-endpoint probes.
#
# Matches "HONEYPOT PROBE" lines MyPortal writes to FAIL2BAN_LOG_PATH when an
# anonymous client requests a page or API path the portal does not serve.
# Signed-in browser sessions, the Tray and RMM agent API prefixes and files
# browsers fetch automatically (favicon.ico, robots.txt ...) are never logged.
#
# Example line:
# 2026-11-24T10:00:00.000+0000 | WARNING | - | - | honeypot | HONEYPOT PROBE ip=203.0.113.10 status=404 method=GET path=/api/v1/users

[Definition]
failregex = ^\s*\| WARNING \| - \| - \| honeypot \| HONEYPOT PROBE ip=<ADDR> status=
ignoreregex =

[Init]
journalmatch =
