# Fail2ban filter for MyPortal login failures.
#
# Matches the "AUTH LOGIN FAIL" lines MyPortal writes to FAIL2BAN_LOG_PATH.
# Fail2ban removes the timestamp before matching, so a line such as
#
# 2026-11-24T10:08:29.736+00:00 | ERROR | abc-123 | - | - | AUTH LOGIN FAIL | client_ip=203.0.113.10 email_hash=b4c9a289323b ip=203.0.113.10 reason=invalid_credentials request_id=abc-123 route=/auth/login user_agent=Mozilla/5.0
#
# is matched from " | ERROR | ...". The request id, user id and feature
# columns may not contain spaces or "|", and the address is taken from the
# ip= field that follows the hashed email, so text a client controls (its
# X-Request-ID or User-Agent) cannot name a different address.

[Definition]
failregex = ^\s*\| ERROR \| [^\s|]+ \| [^\s|]+ \| [^\s|]+ \| AUTH LOGIN FAIL \| (?:client_ip=\S+ )?email_hash=[0-9a-f]+ ip=<ADDR> reason=\S+
ignoreregex =

[Init]
journalmatch =
