# Blue/green nginx config for two-instance MyPortal rolling deploys
# (Track B2 of docs/zero_downtime_upgrades.md).
#
# Both instances point at the same MySQL database.  scripts/upgrade.sh
# --rolling drains one side, upgrades it, waits for /readyz, then does
# the other side so user requests are continuously served by at least
# one instance.
#
# upgrade.sh atomically replaces the mandatory include, validates the complete
# nginx configuration, and reloads it. Exactly one server accepts new work.

upstream myportal_app {
  # Run two MyPortal systemd instances:
  #   systemctl enable --now myportal@blue.service   # listens on 8001
  #   systemctl enable --now myportal@green.service  # listens on 8002
  include /etc/nginx/conf.d/myportal-active.inc;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  client_max_body_size 15m;

  location = /upgrade-status { alias /opt/myportal/shared/state/upgrade-state.json; default_type application/json; add_header Cache-Control "no-store" always; }
  location = /upgrade.html { alias /opt/myportal/current/app/static/upgrade.html; default_type text/html; add_header Retry-After "15" always; add_header Cache-Control "no-store" always; }
  location = /upgrade-unavailable.json { alias /opt/myportal/current/app/static/upgrade-unavailable.json; default_type application/json; add_header Retry-After "15" always; add_header Cache-Control "no-store" always; }

  # Build agent uploads of company-specific tray installers are far larger
  # than the default body limit (docs/wiki/getting-started/Tray Build Server.md).
  location ^~ /api/tray/build-agent/ {
    client_max_body_size 1g;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://myportal_app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ^~ /api/ {
    proxy_pass http://myportal_app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_intercept_errors on;
    error_page 502 503 504 =503 /upgrade-unavailable.json;
  }

  location = /healthz {
    proxy_pass http://myportal_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    access_log off;
  }

  location = /readyz {
    proxy_pass http://myportal_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    access_log off;
  }

  # WebSockets: the tray agent (/ws/tray/...), live page refresh
  # (/ws/refresh) and MCP (/mcp/ws). The catch-all location below clears the
  # Connection header for upstream keep-alive, which strips the Upgrade
  # handshake, so these need their own location with long idle timeouts.
  location ^~ /ws/ {
    proxy_pass http://myportal_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location = /mcp/ws {
    proxy_pass http://myportal_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://myportal_app;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_intercept_errors on;
    # Preserve application timeouts so they do not look like planned upgrades.
    error_page 502 503 =503 /upgrade.html;

    # Failover to the other backend if the active one is being
    # restarted or has been marked ``down``.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;
  }
}
